version: "3.8"

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lab-system-web
    restart: always
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://postgres:password@db:5432/lab_system?schema=public
      - NEXTAUTH_SECRET=your_nextauth_secret_changeme
      - NEXTAUTH_URL=http://localhost:3000
    depends_on:
      - db

  db:
    image: postgres:15-alpine
    container_name: lab-system-db
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=lab_system
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

volumes:
  db-data:
