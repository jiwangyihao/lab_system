name: Build Docker Image

on:
  push:
    branches: ["main", "master"]
    paths:
      - "lab_system/**"
      - ".github/workflows/docker-build.yml"
  workflow_dispatch:

env:
  IMAGE_NAME: lab-system

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-

      - name: Build and Export Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: ./lab_system
          file: ./lab_system/Dockerfile
          push: false
          load: false # 'load: true' loads to local docker daemon (not what we want for tar export usually, but 'type=docker' implies saving safely)
          # Use outputs type=docker to save as tarball
          outputs: type=docker,dest=/tmp/lab-system-image.tar
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: lab-system-image
          path: /tmp/lab-system-image.tar
          retention-days: 5
